name = "ImprovedWeylBounds"
version = "0.1.0"
keywords = ["mathematics", "number-theory", "weyl-sums"]
defaultTargets = ["ImprovedWeylBounds"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
linter.style.header = false
maxRecDepth = 4000

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.32.1"

[[lean_lib]]
name = "ImprovedWeylBounds"
